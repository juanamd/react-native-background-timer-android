apply plugin: 'com.android.library'
apply plugin: 'com.facebook.react'

def DEFAULT_COMPILE_SDK_VERSION = 35

def getExtOrDefault(name, fallback) {
	return rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback
}

android {
	namespace "os.juanamd.backgroundtimer"
	compileSdk getExtOrDefault('compileSdkVersion', DEFAULT_COMPILE_SDK_VERSION)

	defaultConfig {
		minSdk getExtOrDefault('minSdkVersion', 24)
		consumerProguardFiles 'consumer-rules.pro'
	}

	compileOptions {
		sourceCompatibility JavaVersion.VERSION_17
		targetCompatibility JavaVersion.VERSION_17
	}
}

dependencies {
	implementation 'com.facebook.react:react-android'
}
